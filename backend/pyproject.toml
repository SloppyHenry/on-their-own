[project]
name = "simulacra"
version = "0.1.0"
description = "Autonome KI-Agenten in einer persistenten Simulation"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simulacra"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration and not slow'"
markers = ["integration: braucht das echte Modell auf maintux (Aufruf: pytest -m integration)", "slow: Langlauf über sieben Simulationstage (Aufruf: pytest -m slow)"]
