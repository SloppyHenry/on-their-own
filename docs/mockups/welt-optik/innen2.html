<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Innenräume (Mockup)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1322; color: #fff8ec; font: 500 14px ui-rounded, system-ui, sans-serif; }
  canvas { display: block; image-rendering: pixelated; }
  .leiste { position: fixed; left: 12px; top: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 10px; border-radius: 12px; background: rgba(43, 34, 51, 0.9); border: 2px solid #3b2c3d; }
  .leiste b { margin-right: 6px; }
  .trenn { width: 1px; align-self: stretch; background: rgba(255, 248, 236, 0.3); margin: 0 4px; }
  button { font: inherit; color: #3b2c3d; background: #fff8ec; border: 2px solid #3b2c3d; border-radius: 999px; padding: 2px 10px; cursor: pointer; }
  button[aria-pressed="true"] { background: #ffd36e; }
  #raeume { display: contents; }
</style>
</head>
<body>
<!-- Mockup: Innenräume des Hauses der Startwelt neu gestaltet (Tapeten, Fenster, Einrichtung, Licht). Kein Produktionscode. -->
<canvas id="bild"></canvas>
<div class="leiste">
  <b>Innenräume · Mockup</b>
  <button data-variante="haus">1 · Ganzes Haus (Puppenhaus)</button><button data-variante="raum">2 · Ein Raum groß</button>
  <span class="trenn"></span>
  <button data-zeit="Morgen">Morgen</button><button data-zeit="Mittag">Mittag</button><button data-zeit="Abend">Abend</button><button data-zeit="Nacht">Nacht</button>
  <span class="trenn"></span>
  <span id="raeume"></span>
</div>
<script src="innen2.js"></script>
</body>
</html>
