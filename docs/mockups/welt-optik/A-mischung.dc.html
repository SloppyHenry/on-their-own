<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Mischung: Pixelwelt mit Tiefe</title>
<script src="./support.js"></script>
<script src="./world.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3b2c3d}a:hover{color:#1f1621}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; background: #2b2233; font-family: 'Baloo 2', ui-rounded, system-ui, sans-serif; color: #3b2c3d">
<canvas ref="{{setCanvas}}" width="1280" height="800" style="position: absolute; left: 0; top: 0; width: 1280px; height: 800px; image-rendering: pixelated" role="img" aria-label="Das Dorf am See als Pixelwelt mit gewölbtem Horizont: Haus, Garten, Brunnenplatz, See mit Steg, Wald"></canvas>
<sc-if value="{{ui}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 24px; top: 20px; display: flex; align-items: center; gap: 14px; padding: 8px 22px 8px 10px; background: #fff8ec; border-radius: 999px; box-shadow: 0 5px 0 rgba(59,44,61,0.28); border: 3px solid #3b2c3d">
<div style="width: 40px; height: 40px; border-radius: 999px; background: {{skyChip}}; display: flex; align-items: center; justify-content: center">
<sc-if value="{{isNight}}" hint-placeholder-val="{{ false }}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff4d6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
</sc-if>
<sc-if value="{{isDay}}" hint-placeholder-val="{{ true }}">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff8ec" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"></path></svg>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; line-height: 1.05">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.14em; color: #8a6f5e">SIMULACRA · DORF AM SEE</span>
<span style="font-size: 26px; font-weight: 800">Tag 4 · {{uhr}}</span>
</div>
</div>
<div style="position: absolute; right: 24px; top: 22px; display: flex; gap: 12px">
<button type="button" aria-label="Pause" style="width: 52px; height: 52px; border-radius: 999px; border: 3px solid #3b2c3d; background: #fff8ec; box-shadow: 0 5px 0 rgba(59,44,61,0.28); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="#3b2c3d" aria-hidden="true"><rect x="6" y="5" width="4.5" height="14" rx="1.5"></rect><rect x="13.5" y="5" width="4.5" height="14" rx="1.5"></rect></svg>
</button>
<button type="button" aria-label="Schneller" style="height: 52px; padding: 0 18px; border-radius: 999px; border: 3px solid #3b2c3d; background: #ffd94f; box-shadow: 0 5px 0 rgba(59,44,61,0.28); display: flex; align-items: center; gap: 6px; font-family: inherit; font-size: 20px; font-weight: 800; color: #3b2c3d; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="#3b2c3d" aria-hidden="true"><path d="M4 6l8 6-8 6zM12 6l8 6-8 6z"></path></svg>4×</button>
<button type="button" aria-label="Gedächtnis von Alex und Mira" style="width: 52px; height: 52px; border-radius: 999px; border: 3px solid #3b2c3d; background: #fff8ec; box-shadow: 0 5px 0 rgba(59,44,61,0.28); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b2c3d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"></path><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5"></path><path d="M9 8h7M9 11.5h5"></path></svg>
</button>
</div>
<div style="position: absolute; left: {{mira.bx}}px; top: {{mira.by}}px; transform: translate(-50%, -100%); max-width: 300px; padding: 12px 18px; background: #fffdf7; border: 3px solid #3b2c3d; border-radius: 22px; box-shadow: 0 5px 0 rgba(59,44,61,0.25); font-size: 19px; font-weight: 600; line-height: 1.25; white-space: nowrap">Alex, die Tomaten sind fast reif!<div style="position: absolute; left: 50%; bottom: -14px; width: 20px; height: 20px; background: #fffdf7; border-right: 3px solid #3b2c3d; border-bottom: 3px solid #3b2c3d; transform: translateX(-50%) rotate(45deg)"></div></div>
<div style="position: absolute; left: {{mira.tx}}px; top: {{mira.ty}}px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 2px 12px 2px 6px; background: #fff8ec; border: 3px solid #4f9a63; border-radius: 999px; font-size: 15px; font-weight: 700; white-space: nowrap"><span style="width: 12px; height: 12px; border-radius: 999px; background: #4f9a63"></span>Mira · am Brunnen</div>
<div style="position: absolute; left: {{alex.tx}}px; top: {{alex.ty}}px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 2px 12px 2px 6px; background: #fff8ec; border: 3px solid #d98a2b; border-radius: 999px; font-size: 15px; font-weight: 700; white-space: nowrap"><span style="width: 12px; height: 12px; border-radius: 999px; background: #d98a2b"></span>Alex · gießt die Tomaten</div>
<form style="position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); width: 620px; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 22px; background: #fff8ec; border: 3px solid #3b2c3d; border-radius: 999px; box-shadow: 0 5px 0 rgba(59,44,61,0.28)">
<label for="ereignis-a" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Ereignis</label>
<input id="ereignis-a" type="text" placeholder="Was soll im Dorf passieren? „Heute beginnt es zu regnen.“" style="flex: 1; min-width: 0; border: 0; background: transparent; font-family: inherit; font-size: 19px; font-weight: 600; color: #3b2c3d; outline: none" />
<button type="button" style="height: 46px; padding: 0 22px; border-radius: 999px; border: 3px solid #3b2c3d; background: #7fc48f; font-family: inherit; font-size: 18px; font-weight: 800; color: #1f3a27; cursor: pointer">Geschehen lassen</button>
</form>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"zeit":{"editor":"enum","options":["Morgen","Mittag","Abend","Nacht"],"default":"Abend"},"ui":{"editor":"boolean","default":true},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  componentWillUnmount() { if (this.world) { this.world.stop(); this.world = null; } }
  componentDidUpdate() { this.restart(); }
  restart() {
    var zeit = this.props.zeit ?? 'Abend';
    if (!this.cv || typeof createWorld !== 'function') return;
    if (this.world && this.zeitNow === zeit) return;
    if (this.world) this.world.stop();
    this.zeitNow = zeit;
    this.world = createWorld(this.cv, { mode: 'mashup', zeit: zeit });
  }
  renderVals() {
    if (!this.setCanvas) {
      this.setCanvas = (el) => {
        if (el) { this.cv = el; this.restart(); }
        else if (this.world) { this.world.stop(); this.world = null; this.cv = null; }
      };
    }
    var zeit = this.props.zeit ?? 'Abend';
    var uhr = { Morgen: '07:20', Mittag: '12:45', Abend: '18:40', Nacht: '23:10' }[zeit] || '18:40';
    var chip = { Morgen: '#f2a77a', Mittag: '#5aaee8', Abend: '#e3795a', Nacht: '#353b70' }[zeit] || '#e3795a';
    var a = { x: 0, y: 0 }, m = { x: 0, y: 0, sc: 1 };
    if (typeof wScreen === 'function') { a = wScreen('mashup', 50, 140, 0); m = wScreen('mashup', 110, 121, 0); }
    return {
      setCanvas: this.setCanvas,
      ui: this.props.ui ?? true,
      uhr: uhr,
      skyChip: chip,
      isNight: zeit === 'Nacht',
      isDay: zeit !== 'Nacht',
      alex: { tx: Math.round(a.x), ty: Math.round(a.y + 10) },
      mira: { tx: Math.round(m.x), ty: Math.round(m.y + 10), bx: Math.round(m.x), by: Math.round(m.y - 23 * 4 * m.sc - 20) }
    };
  }
}
</script>
</body>
</html>
