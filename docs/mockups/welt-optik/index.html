<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>SIMULACRA Welt-Optik (Mockups)</title>
<style>
  body { margin: 0; background: #2b2233; color: #fff8ec; font: 600 15px ui-rounded, system-ui, sans-serif; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; align-items: center; }
  button { font: inherit; padding: 6px 14px; border-radius: 999px; border: 2px solid #fff8ec; background: transparent; color: inherit; cursor: pointer; }
  button[aria-pressed="true"] { background: #fff8ec; color: #2b2233; }
  canvas { display: block; max-width: 100%; height: auto; image-rendering: pixelated; }
</style>
</head>
<body>
<!-- Mockup-Vorschau ohne Arbeitsfläche: Datei im Browser öffnen. A = Mischung (gewählt), B = flach, C = 3D. Kein Produktionscode. -->
<nav aria-label="Ansicht">
  <span>Richtung:</span>
  <button data-mode="mashup" aria-pressed="true">A · Mischung</button>
  <button data-mode="flat">B · 2D</button>
  <button data-mode="raum">C · 3D</button>
  <span style="margin-left:16px">Tageszeit:</span>
  <button data-zeit="Morgen">Morgen</button>
  <button data-zeit="Mittag">Mittag</button>
  <button data-zeit="Abend" aria-pressed="true">Abend</button>
  <button data-zeit="Nacht">Nacht</button>
</nav>
<canvas id="welt" width="1280" height="800"></canvas>
<script src="world.js"></script>
<script src="raum.js"></script>
<script>
  var mode = 'mashup', zeit = 'Abend', world = null, cv = document.getElementById('welt');
  function start() {
    if (world) world.stop();
    var fresh = cv.cloneNode(); cv.replaceWith(fresh); cv = fresh;          // neuer 2D-Kontext ohne Reste
    world = mode === 'raum' ? createWorld3D(cv, { zeit: zeit }) : createWorld(cv, { mode: mode, zeit: zeit });
  }
  document.querySelectorAll('nav button').forEach(function (b) {
    b.addEventListener('click', function () {
      var key = b.dataset.mode ? 'mode' : 'zeit';
      document.querySelectorAll('nav button[data-' + key + ']').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      if (key === 'mode') mode = b.dataset.mode; else zeit = b.dataset.zeit;
      start();
    });
  });
  start();
</script>
</body>
</html>
