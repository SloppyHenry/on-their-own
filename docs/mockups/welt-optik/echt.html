<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>SIMULACRA Startwelt in Optik A (Mockup AP13)</title>
<style>
  body { margin: 0; background: #2b2233; color: #fff8ec; font: 500 15px ui-rounded, system-ui, sans-serif; }
  section { padding: 18px 16px 8px; }
  h2 { margin: 0 0 4px; font-size: 20px; }
  p { margin: 0 0 10px; max-width: 1280px; color: #e9dccb; line-height: 1.4; }
  canvas { display: block; max-width: 100%; height: auto; image-rendering: pixelated; border-radius: 6px; }
</style>
</head>
<body>
<!-- Die echte Startwelt mit Code, Sprites und Effekten aus Mockup A (world.js) unverändert. Kein Produktionscode. -->
<section data-panel="abend-nah" data-zeit="Abend" data-cam="30,18,0.8"><h2>Abend, Kamera wie in Mockup A</h2><canvas width="1280" height="800"></canvas></section>
<section data-panel="mittag-nah" data-zeit="Mittag" data-cam="30,18,0.8"><h2>Mittag, Kamera wie in Mockup A</h2><canvas width="1280" height="800"></canvas></section>
<section data-panel="nacht-nah" data-zeit="Nacht" data-cam="30,18,0.8"><h2>Nacht, Kamera wie in Mockup A</h2><canvas width="1280" height="800"></canvas></section>
<section data-panel="mittag-weit" data-zeit="Mittag" data-cam="36,23,0.45"><h2>Mittag, ganze Welt (Taste 0)</h2><canvas width="1280" height="800"></canvas></section>
<script src="world.js"></script>
<script src="figuren.js"></script>
<script src="haus.js"></script>
<script src="echt.js"></script>
<script>
  document.querySelectorAll('section[data-panel]').forEach(function (s) {
    var c = s.dataset.cam.split(',').map(Number);
    eRender(s.querySelector('canvas'), s.dataset.zeit, hCam(c[0] * 16, c[1] * 16, c[2]));
  });
  document.body.dataset.ready = '1';
</script>
</body>
</html>
