<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruhige Ansicht (Mockup)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2233; color: #fff8ec; font: 500 14px ui-rounded, system-ui, sans-serif; }
  canvas { display: block; image-rendering: pixelated; touch-action: none; }
  .leiste { position: fixed; left: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 10px; border-radius: 12px;
    background: rgba(43, 34, 51, 0.88); border: 2px solid #3b2c3d; max-width: calc(100vw - 48px); }
  .leiste b { margin-right: 6px; }
  button { font: inherit; color: #3b2c3d; background: #fff8ec; border: 2px solid #3b2c3d; border-radius: 999px; padding: 2px 10px; cursor: pointer; }
  button[aria-pressed="true"] { background: #ffd36e; }
  #schilder { position: fixed; inset: 0; pointer-events: none; }
  #tilt { position: fixed; inset: 0; pointer-events: none; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
  @media (prefers-reduced-motion: reduce) { #tilt { display: none !important; } }
  .trenn { width: 1px; align-self: stretch; background: rgba(255, 248, 236, 0.3); margin: 0 4px; }
  #zoom { margin-left: 6px; opacity: 0.8; font-variant-numeric: tabular-nums; }
  #raus { position: fixed; left: 12px; top: 60px; font-weight: 600; padding: 5px 14px; }
  .hilfe { position: fixed; left: 12px; bottom: 12px; right: 12px; padding: 6px 10px; border-radius: 10px; background: rgba(43, 34, 51, 0.78); font-size: 13px; line-height: 1.5; color: #e9dccb; width: fit-content; }
  kbd { font: 600 12px ui-monospace, monospace; padding: 0 4px; border-radius: 4px; background: #fff8ec; color: #3b2c3d; }
</style>
</head>
<body>
<!-- Mockup: Startwelt mit den Grafiken der App, Zoom in ganzen Pixelstufen; „Eben“ oder „Tiefe“ (Wölbung), Effekte aus Mockup A schaltbar. Kein Produktionscode. -->
<canvas id="welt"></canvas>
<div id="tilt"></div>
<canvas id="schilder"></canvas>
<div class="leiste">
  <b>Ruhige Ansicht · Mockup</b>
  <button data-zeit="Morgen">Morgen</button><button data-zeit="Mittag">Mittag</button><button data-zeit="Abend">Abend</button><button data-zeit="Nacht">Nacht</button>
  <span class="trenn"></span>
  <button data-ansicht="eben">Eben</button><button data-ansicht="tiefe">Tiefe</button>
  <button id="effekte">Effekte</button>
  <span id="zoom"></span>
</div>
<button id="raus" hidden>← zurück ins Dorf (Esc)</button>
<div class="hilfe">
  <kbd>W A S D</kbd> / <kbd>Pfeile</kbd> wandern (<kbd>Shift</kbd> schneller) · Ziehen verschiebt · Mausrad oder <kbd>+</kbd>/<kbd>−</kbd> zoomt in ganzen Pixelstufen · <kbd>0</kbd> ganze Welt ·
  Klick auf Figur wählt (<kbd>Tab</kbd> wechselt) · Klick auf Boden: hingehen · Klick aufs Haus: hineinsehen · <kbd>Esc</kbd> zurück
</div>
<script src="ruhig.js"></script>
</body>
</html>
